# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Ollama Tests

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ "main", "develop" ]

jobs:
  integration-tests:
    name: ${{ matrix.job-name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - job-name: "ollama-executor-tests"
            test-group: "ai.koog.integration.tests.executor.OllamaExecutorIntegrationTest"
            artifact-name: "ollama-executor-tests"
            os: ubuntu-latest
          - job-name: "ollama-agent-tests"
            test-group: "ai.koog.integration.tests.agent.OllamaAgentIntegrationTest"
            artifact-name: "ollama-agent-tests"
            os: ubuntu-latest
          - job-name: "ollama-simple-agent-tests"
            test-group: "ai.koog.integration.tests.agent.OllamaSimpleAgentIntegrationTest"
            artifact-name: "ollama-simple-agent-tests"
            os: ubuntu-latest
      fail-fast: false

    steps:
      - name: Configure Git
        run: git config --global core.autocrlf input

      - name: Free up disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Docker system info ==="
          docker system df

          # Stop and remove all containers
          docker ps -aq | xargs -r docker rm -f || true

          # Remove all Docker images (we'll pull Ollama fresh, only cache volumes)
          docker image prune -af

          # Remove unused networks
          docker network prune -f

          # Clean package caches
          sudo apt-get clean
          sudo apt-get autoclean
          sudo apt-get autoremove -y

          # Remove large directories
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/az
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /home/runner/.dotnet
          sudo rm -rf /opt/hostedtoolcache

          # Clean npm and yarn caches
          sudo rm -rf /home/runner/.npm
          sudo rm -rf /home/runner/.yarn

          echo "=== Disk space after cleanup ==="
          df -h

      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      # Cache Docker volume containing Ollama models
      - name: Cache Ollama models volume
        uses: actions/cache@v4
        with:
          path: ~/ollama-cache
          key: ollama-models-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ollama-models-${{ runner.os }}-

      # Restore Ollama volume from cache
      - name: Restore Ollama volume from cache
        run: |
          if [ -f ~/ollama-cache/ollama-volume.tar ]; then
            echo "=== Restoring Ollama volume from cache ==="

            # Create the volume
            docker volume create ollama-models || true

            # Restore volume contents from cache
            docker run --rm -v ollama-models:/data -v ~/ollama-cache:/backup alpine sh -c "cd /data && tar xf /backup/ollama-volume.tar --strip 1" || echo "No data to restore or restore failed"

            echo "=== Volume restored ==="
            docker volume ls
          else
            echo "=== No cached volume found, will create fresh ==="
            docker volume create ollama-models || true
          fi

      - name: Check disk space before tests
        run: |
          echo "=== Disk space ==="
          df -h
          echo "=== Available space in GB ==="
          df -BG / | tail -1 | awk '{print "Available: " $4}'
          echo "=== Docker info ==="
          docker system df
          echo "=== Memory info ==="
          free -h

      - name: JvmOllamaTest with Gradle Wrapper
        env:
          OLLAMA_IMAGE_URL: ${{ vars.OLLAMA_IMAGE_URL }}
          OLLAMA_VOLUME_NAME: ollama-models
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx1g -XX:MaxMetaspaceSize=512m"
        run: |
          echo "=== Starting tests with available disk space ==="
          df -h / | tail -1

          ./gradlew jvmOllamaTest \
            --tests "${{ matrix.test-group }}" \
            --no-parallel \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --continue \
            --stacktrace

          echo "=== Test completed, checking disk space ==="
          df -h / | tail -1
        timeout-minutes: 60

      # Save volume to cache after tests
      - name: Save Ollama volume to cache
        if: always()
        run: |
          echo "=== Saving Ollama volume to cache ==="
          mkdir -p ~/ollama-cache

          # Export the volume contents to a tar file
          docker run --rm -v ollama-models:/data -v ~/ollama-cache:/backup alpine sh -c "cd /data && tar cf /backup/ollama-volume.tar ." || echo "Failed to save volume"

          if [ -f ~/ollama-cache/ollama-volume.tar ]; then
            echo "=== Volume saved successfully ==="
            ls -lh ~/ollama-cache/ollama-volume.tar
          else
            echo "=== Volume save failed ==="
          fi

      - name: Cleanup Docker resources
        if: always()
        run: |
          echo "=== Stopping all containers ==="
          docker ps -q | xargs -r docker stop || true

          echo "=== Removing all containers ==="
          docker ps -aq | xargs -r docker rm -f || true

          echo "=== Removing all images ==="
          docker image prune -af

          echo "=== Pruning system (preserving ollama-models volume) ==="
          docker system prune -af

          echo "=== Current volumes (ollama-models should be preserved) ==="
          docker volume ls

          echo "=== Final disk space ==="
          df -h

      - name: Check disk space after tests
        if: always()
        run: |
          echo "=== Final disk space check ==="
          df -h
          echo "=== Available space in GB ==="
          df -BG / | tail -1 | awk '{print "Available: " $4}'
          echo "=== Docker system info ==="
          docker system df
          echo "=== Largest directories in /home/runner ==="
          sudo du -sh /home/runner/* 2>/dev/null | sort -hr | head -10 || true

      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.artifact-name }}
          path: |
            **/build/reports/
          retention-days: 7
