name: A2A TCK Test

on:
  push:
    paths:
      - 'a2a/**'
  pull_request:
    paths:
      - 'a2a/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

env:
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: 'corretto'

jobs:
  a2a-tck-test:
    if: false # TODO re-enable after 1.0 is done
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Setup A2A TCK
        working-directory: ./a2a/test-tck
        run: ./setup_tck.sh

      - name: Build test server
        run: ./gradlew :a2a:test-tck:a2a-test-server-tck:assemble

      - name: Start test server in background
        working-directory: ./a2a/test-tck
        run: |
          ./run_sut.sh > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

          # Wait until the agent card is served (max 120 seconds)
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:9999/.well-known/agent-card.json > /dev/null; then
              echo "Server started successfully"
              exit 0
            fi
            sleep 1
          done

          echo "Server did not start in time"
          tail -n 100 server.log
          exit 1

      # The step's exit code is the pytest exit code: failed MUST tests fail it, xfail'ed SHOULD tests don't
      - name: Run TCK tests
        working-directory: ./a2a/test-tck
        run: ./run_tck.sh --sut-host http://localhost:9999 --transport jsonrpc -v

      - name: Stop test server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" || true
            wait "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload TCK reports and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a2a-tck-reports
          path: |
            a2a/test-tck/a2a-tck/reports/**
            a2a/test-tck/server.log
          if-no-files-found: warn
